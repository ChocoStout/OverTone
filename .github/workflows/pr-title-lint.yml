name: pr-title-lint

# Enforce that every PR title is a valid Conventional Commit. PRs are squash-merged, so the PR
# title becomes the single commit on main that release-please reads to compute the next version
# and changelog — keeping it valid here is what keeps releases working.
#
# pull_request_target (not pull_request) so the check also runs on PRs from forks. This is safe:
# the job only reads the PR title via the API and never checks out or runs the PR's code.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: write   # post/update a comment explaining a failing title

jobs:
  validate:
    name: Validate PR title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed types — mirrors the Conventional Commits spec and what release-please understands.
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
