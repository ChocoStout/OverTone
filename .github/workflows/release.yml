name: release

# Trunk-based releases via release-please (Conventional Commits):
#   1. Every push to main updates a "release PR" that bumps the version + CHANGELOG.
#   2. Merging that release PR creates the GitHub Release + tag, which flips
#      release_created=true and runs the publish job below in the same workflow run.
# Because publish is a downstream job (not a separate workflow keyed off the tag),
# the default GITHUB_TOKEN is sufficient — no PAT required.
on:
  push:
    branches: [ main ]

# Serialize so two quick merges can't race the release PR or a publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the GitHub Release + tag
      pull-requests: write   # open/update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Pack & publish (OverTone + DI)
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach package assets to the GitHub Release
      packages: write   # push to GitHub Packages

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history -> deterministic Source Link

      - name: Setup .NET (8 + 10)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      # Build with the release version so the embedded assembly version matches the package.
      - name: Build
        run: >
          dotnet build --configuration Release --no-restore
          -p:Version=${{ needs.release-please.outputs.version }}

      # Gate the publish on a green test run — a bad NuGet.org push can't be unpublished.
      - name: Test (net8.0 + net10.0)
        run: dotnet test --configuration Release --no-build --verbosity normal

      # Packs every IsPackable project: OverTone and OverTone.Extensions.DependencyInjection.
      - name: Pack
        run: >
          dotnet pack --configuration Release --no-build
          -p:Version=${{ needs.release-please.outputs.version }}
          --output ${{ runner.temp }}/nupkg

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NUGET_API_KEY secret not set — skipping NuGet.org push."
            exit 0
          fi
          dotnet nuget push "${{ runner.temp }}"/nupkg/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Push to GitHub Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          dotnet nuget push "${{ runner.temp }}"/nupkg/*.nupkg
          --api-key "$GH_TOKEN"
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --skip-duplicate
          --no-symbols

      # Attach the .nupkg/.snupkg to the release release-please just created.
      - name: Attach packages to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release upload "${{ needs.release-please.outputs.tag_name }}"
          "${{ runner.temp }}"/nupkg/*.nupkg
          "${{ runner.temp }}"/nupkg/*.snupkg
          --clobber
